<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Práctica de Clase de GitHub</title>
    <style>
   
        
    </style>
</head>
<body>
    <div class="card">
        <h2>Bienvenido</h2>
        <p>Ingresa tu nombre para continuar</p>
        <input type="text" id="nombreUsuario" placeholder="Escribe tu nombre...">
        <button id="btnSaludar">Saludar</button>
        <div id="mensaje"></div>
    </div>

    <script>
        // El programador JS insertará su código aquí
        document.getElementById(&#39;btnSaludar&#39;).addEventListener(&#39;click&#39;, function() {
const nombre = document.getElementById(&#39;nombreUsuario&#39;).value;
const display = document.getElementById(&#39;mensaje&#39;);
if (nombre.trim() === &quot;&quot;) {
display.innerText = &quot;⚠️ Por favor, escribe algo.&quot;;
display.style.color = &quot;red&quot;;
} else {
display.innerText = &quot;¡Hola, &quot; + nombre + &quot;! Éxito en tu práctica de Git.&quot;;
display.style.color = &quot;green&quot;;
}
});
        
    </script>
</body>
</html>
